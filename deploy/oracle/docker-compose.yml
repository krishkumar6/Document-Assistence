# Oracle Cloud (or any Linux server with Docker): the app behind Caddy, which
# gets and renews a free HTTPS certificate automatically. The password is sent
# with every request, so HTTPS is required, not optional.
#
#   cd deploy/oracle && docker compose up -d --build
services:
  app:
    build:
      context: ../..
    env_file: .env            # LLM_PROVIDER, GROQ_API_KEY, APP_PASSWORD (git-ignored)
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data          # uploaded PDFs, search index, logs: survive restarts and rebuilds
    expose:
      - "8000"                # reachable only by Caddy, never directly from the internet
    restart: unless-stopped
    mem_limit: 1200m          # app peaks ~0.6 GB; the cap protects the rest of the server

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/oracle/.env (setup.sh does this for you)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
