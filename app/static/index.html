<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%233558d6'/%3E%3Cpath d='M11 11h10M11 16h10M11 21h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #3558d6; --accent-soft: #eef2ff; --ok: #1a7f4b; --ok-soft: #e8f6ee;
    --warn: #9a5b00; --warn-soft: #fff5e0; --err: #b42318; --err-soft: #fdecea;
    --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #171b23; --text: #e6e8ec; --muted: #9aa3b2; --line: #2a303b;
      --accent: #7c96ff; --accent-soft: #1e2640; --ok: #5cc98d; --ok-soft: #13291d;
      --warn: #f0b44c; --warn-soft: #2e2413; --err: #ff8a80; --err-soft: #331715;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
  .step-title { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 0 0 12px; font-size: 1.05rem; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
         display: grid; place-items: center; font-size: .85rem; flex: none; }

  /* upload */
  .drop { display: block; border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center;
          cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--accent); }
  .drop small { display: block; color: var(--muted); margin-top: 4px; }
  #files { display: none; }
  .library { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .library .label { color: var(--muted); font-size: .9rem; margin-right: 2px; }
  .chip { background: var(--accent-soft); color: var(--text); border-radius: 999px; padding: 3px 12px;
          font-size: .85rem; }
  .empty { color: var(--muted); font-size: .9rem; }

  /* ask */
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 12px 14px; font: inherit; color: inherit;
             background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 14px; }
  .mode { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; }
  .mode input { margin-top: 4px; accent-color: var(--accent); }
  .mode b { display: block; font-size: .95rem; }
  .mode span { color: var(--muted); font-size: .85rem; }
  .mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .web-toggle { color: var(--muted); font-size: .9rem; display: flex; gap: 6px; align-items: center; }
  .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { background: transparent; color: var(--accent); border: 1px solid var(--line);
                     font-weight: 500; font-size: .85rem; padding: 5px 12px; border-radius: 999px; }

  /* status + answer */
  .notice { border-radius: 10px; padding: 10px 14px; margin-top: 14px; font-size: .95rem; }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.err { background: var(--err-soft); color: var(--err); }
  .working { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answer { font-size: 1.02rem; }
  .answer p { margin: 0 0 10px; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .answer sup a { text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 5px;
                  padding: 0 5px; font-size: .75rem; font-weight: 600; }
  .sources h3 { font-size: .95rem; margin: 18px 0 10px; color: var(--muted); font-weight: 600; }
  .source { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .source.flash { outline: 2px solid var(--accent); }
  .source .head { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: .92rem; }
  .source .id { color: var(--accent); }
  .source .where { color: var(--muted); font-weight: 500; }
  .source a { color: var(--accent); word-break: break-all; }
  .source blockquote { margin: 6px 0 0; color: var(--muted); font-size: .88rem; border-left: 3px solid var(--line); padding-left: 10px; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 12px; }
  details.steps { margin-top: 14px; }
  details.steps summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .steplist { margin: 10px 0 0; padding: 0; list-style: none; border-left: 2px solid var(--line); }
  .steplist li { padding: 4px 0 8px 14px; font-size: .88rem; }
  .steplist code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px;
                   font-size: .82rem; word-break: break-word; }
  .steplist .out { color: var(--muted); display: block; margin-top: 2px; white-space: pre-wrap; }
  .steplist .bad { color: var(--err); }
  .steplist.live { margin: 12px 0; }
  .steplist.live:empty { display: none; }
  #liveAnswer { margin-top: 12px; }
  .cursor { display: inline-block; width: 8px; height: 1.05em; background: var(--accent); vertical-align: text-bottom;
            margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor, .spinner { animation: none; } }
  footer { color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { .modes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Document Assistant</h1>
  <p class="sub">Add your PDFs, ask a question, and get an answer that shows exactly which page it came from.</p>

  <section class="card">
    <p class="step-title"><span class="num">1</span>Add your PDFs</p>
    <label class="drop" id="drop" for="files">
      <strong>Click to choose PDFs</strong> or drag them here
      <small>You can add several at once. Adding a file with the same name replaces the old one.</small>
    </label>
    <input type="file" id="files" accept="application/pdf,.pdf" multiple>
    <div id="uploadStatus"></div>
    <div class="library" id="library"></div>
  </section>

  <section class="card">
    <p class="step-title"><span class="num">2</span>Ask a question</p>
    <textarea id="question" placeholder="e.g. What is the minimum password length?"></textarea>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="quick" checked>
        <div><b>Quick answer</b><span>Looks in your PDFs once. Fast.</span></div></label>
      <label class="mode"><input type="radio" name="mode" value="research">
        <div><b>Research</b><span>Several searches, can calculate and check the web. Slower.</span></div></label>
    </div>
    <div class="row">
      <button id="askBtn">Ask</button>
      <label class="web-toggle" id="webToggle" hidden><input type="checkbox" id="allowWeb" checked> Allow web search</label>
    </div>
    <div class="examples" id="examples"></div>
  </section>

  <section class="card" id="result" hidden></section>

  <footer>Developers: API reference at <a href="/docs">/docs</a></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const EXAMPLES = [
  "What is the minimum password length?",
  "An Orbit Cafe grosses $300,000. What do royalty plus marketing fund cost per year?",
];

// ---------- helpers ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch { /* non-JSON error page */ }
  if (!res.ok) {
    let msg = body && body.detail;
    if (Array.isArray(msg)) msg = msg.map((d) => d.msg).join("; ");
    throw new Error(msg || `Request failed (${res.status})`);
  }
  return body;
}
function notice(kind, html) { return `<div class="notice ${kind}">${html}</div>`; }

// Tiny, safe markdown: escape everything first, then add bold, lists, paragraphs and [n] links.
function renderAnswer(text) {
  const lines = esc(text).split(/\r?\n/);
  let html = "", list = null;
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+)\]/g, '<sup><a href="#src-$1" data-src="$1">$1</a></sup>');
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    const bullet = line.match(/^[-*•]\s+(.*)/), numbered = line.match(/^\d+[.)]\s+(.*)/);
    if (bullet || numbered) {
      const kind = bullet ? "ul" : "ol";
      if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
      html += `<li>${inline((bullet || numbered)[1])}</li>`;
    } else if (!line) {
      close();
    } else {
      close();
      html += `<p>${inline(line)}</p>`;
    }
  }
  close();
  return html;
}

function renderSources(citations) {
  if (!citations || !citations.length) return "";
  const items = citations.map((c) => {
    let where;
    if (c.kind === "web") {
      const safe = /^https?:\/\//i.test(c.url || "") ? c.url : "#";
      where = `<span class="where">Web</span></div><a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(c.title || c.url)}</a><div>`;
    } else {
      const pages = c.pages.length > 1 ? `pages ${c.pages.join(", ")}` : `page ${c.pages[0]}`;
      where = `<span>${esc(c.file)}</span><span class="where">· ${pages}</span>`;
    }
    const quote = c.quotes && c.quotes[0] ? `<blockquote>${esc(c.quotes[0])}</blockquote>` : "";
    return `<div class="source" id="src-${c.id}"><div class="head"><span class="id">[${c.id}]</span>${where}</div>${quote}</div>`;
  }).join("");
  return `<div class="sources"><h3>Sources</h3>${items}</div>`;
}

// Turn raw tool output into a one-line, human summary for the step list.
function summarizeResult(t) {
  if (t.tool === "calculator") return `= ${t.output_preview}`;
  if (t.tool === "search_docs") {
    const found = {};
    for (const [, file, page] of t.output_preview.matchAll(/\[S\d+\] \(([^,]+), page (\d+)\)/g)) {
      (found[file] ||= new Set()).add(page);
    }
    const parts = Object.entries(found).map(([f, pages]) => `${f} p. ${[...pages].join(", ")}`);
    return parts.length ? `Found: ${parts.join("; ")}${t.output_preview.endsWith("...") ? " …" : ""}` : t.output_preview;
  }
  if (t.tool === "web_search") {
    const sites = [...t.output_preview.matchAll(/\((https?:\/\/[^/)\s]+)/g)].map((m) => m[1].replace(/^https?:\/\/(www\.)?/, ""));
    return sites.length ? `Found: ${[...new Set(sites)].join(", ")}` : t.output_preview;
  }
  return t.output_preview;
}

function renderSteps(steps) {
  if (!steps || !steps.length) return "";
  const items = steps.map((s) => {
    if (s.action === "final_answer") {
      return `<li>Step ${s.step}: wrote the answer${s.forced ? " (step limit reached, so it answered with what it had)" : ""}</li>`;
    }
    const calls = s.tool_calls.map((t) => {
      const name = { search_docs: "Searched your PDFs", web_search: "Searched the web", calculator: "Calculated" }[t.tool] || t.tool;
      const arg = t.input && typeof t.input === "object" ? (t.input.query || t.input.expression || JSON.stringify(t.input)) : t.input;
      const out = t.is_error ? t.output_preview : summarizeResult(t);
      return `${esc(name)} <code>${esc(arg)}</code><span class="out ${t.is_error ? "bad" : ""}">${esc(out)}</span>`;
    }).join("<br>");
    return `<li>Step ${s.step}: ${calls}${s.note ? `<span class="out">${esc(s.note)}</span>` : ""}</li>`;
  }).join("");
  return `<details class="steps"><summary>How it found this (${steps.length} steps)</summary><ol class="steplist">${items}</ol></details>`;
}

// ---------- library + upload ----------
async function loadLibrary() {
  try {
    const stats = await api("/stats");
    const docs = stats.small ? stats.small.documents : [];
    $("library").innerHTML = docs.length
      ? `<span class="label">In your library:</span>` + docs.map((d) => `<span class="chip">${esc(d)}</span>`).join("")
      : `<span class="empty">No documents yet. Add a PDF to get started.</span>`;
    return docs.length;
  } catch (e) {
    $("library").innerHTML = notice("err", esc(e.message));
    return 0;
  }
}

async function upload(fileList) {
  const files = [...fileList].filter((f) => f.name.toLowerCase().endsWith(".pdf"));
  const skipped = fileList.length - files.length;
  if (!files.length) { $("uploadStatus").innerHTML = notice("err", "Please choose PDF files."); return; }
  const form = new FormData();
  files.forEach((f) => form.append("files", f));
  $("uploadStatus").innerHTML = `<div class="notice working"><span class="spinner"></span>Reading ${files.length} file(s)… large PDFs can take a minute.</div>`;
  try {
    const { ingested } = await api("/ingest", { method: "POST", body: form });
    const lines = ingested.map((r) => r.warning
      ? notice("warn", `<b>${esc(r.file)}</b>: no readable text found. It may be a scanned image, which this tool can't read yet.`)
      : notice("ok", `Added <b>${esc(r.file)}</b> (${r.pages} pages)`));
    if (skipped) lines.push(notice("warn", `${skipped} non-PDF file(s) skipped.`));
    $("uploadStatus").innerHTML = lines.join("");
  } catch (e) {
    $("uploadStatus").innerHTML = notice("err", `Upload failed: ${esc(e.message)}`);
  }
  $("files").value = "";
  loadLibrary();
}

$("files").addEventListener("change", (e) => upload(e.target.files));
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files));

// ---------- ask ----------
const mode = () => document.querySelector('input[name="mode"]:checked').value;
document.querySelectorAll('input[name="mode"]').forEach((r) =>
  r.addEventListener("change", () => { $("webToggle").hidden = mode() !== "research"; }));

// POST and read a Server-Sent Events stream, calling onEvent for each `data:` message.
async function streamPost(path, payload, onEvent) {
  const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
  if (!res.ok) {  // validation errors happen before streaming starts
    let msg = `Request failed (${res.status})`;
    try { const b = await res.json(); msg = Array.isArray(b.detail) ? b.detail.map((d) => d.msg).join("; ") : b.detail || msg; } catch {}
    throw new Error(msg);
  }
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const message = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      for (const line of message.split("\n")) if (line.startsWith("data: ")) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

// While streaming, the raw text still has source labels like [S3] or 【S3】 (they
// become clickable [n] markers when the answer is complete), so hide them, including
// a half-written one at the very end.
function liveText(raw) {
  return raw.replace(/[^\S\n]*[\[【]\s*(?:S(?:ource)?\s*)?\d+(?:\s*[,;]\s*(?:S(?:ource)?\s*)?\d+)*\s*[\]】]/gi, "")
            .replace(/[\[【][^\]】\n]{0,12}$/, "");
}

const TOOL_VERB = { search_docs: "Searching your PDFs", web_search: "Searching the web", calculator: "Calculating" };

function usageLine(d, secs) {
  if (d.from_answer_cache) return `Answered instantly from the answer cache (same question asked recently) · ${secs}s`;
  const cached = d.cached_input_tokens ? ` (${d.cached_input_tokens.toLocaleString()} from prompt cache)` : "";
  const tokens = d.input_tokens ? ` · ${d.input_tokens.toLocaleString()} tokens read${cached}, ${d.output_tokens.toLocaleString()} written` : "";
  return `Answered in ${secs}s${tokens}`;
}

async function ask() {
  const question = $("question").value.trim();
  if (!question) { $("question").focus(); return; }
  const research = mode() === "research";
  const out = $("result");
  out.hidden = false;
  $("askBtn").disabled = true;

  const started = Date.now();
  const status = research ? "Starting research" : "Looking through your documents";
  out.innerHTML = `<div class="working"><span class="spinner"></span><span id="status">${status}…</span></div>
    ${research ? '<ol class="steplist live" id="liveSteps"></ol>' : ""}<div class="answer" id="liveAnswer"></div>`;
  let raw = "", phase = status;
  const setStatus = (text) => { phase = text; const el = $("status"); if (el) el.textContent = `${text}…`; };
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - started) / 1000), el = $("status");
    if (el && s >= 3) el.textContent = `${phase}… ${s}s${s > 15 ? " (free tier can pause briefly)" : ""}`;
  }, 1000);
  const showLive = () => { $("liveAnswer").innerHTML = renderAnswer(liveText(raw)) + '<span class="cursor"></span>'; };
  const stepItem = (n) => {
    let li = $(`live-step-${n}`);
    if (!li) { li = document.createElement("li"); li.id = `live-step-${n}`; $("liveSteps").appendChild(li); }
    return li;
  };

  let final = null, error = null;
  const onEvent = (ev) => {
    switch (ev.type) {
      case "retrieved": setStatus(`Found ${ev.passages.length} passages, writing the answer`); break;
      case "step_start":
        raw = ""; $("liveAnswer").innerHTML = "";
        setStatus(ev.forced ? `Step ${ev.step}: writing the final answer` : `Step ${ev.step}: thinking`);
        break;
      case "delta":
        raw += ev.text; showLive();
        if (!research || phase.indexOf("writing") < 0) setStatus(research ? `Step ${ev.step}: writing` : "Writing the answer");
        break;
      case "retry": raw = ""; $("liveAnswer").innerHTML = ""; setStatus(`Step ${ev.step}: retrying`); break;
      case "tool_call": {
        raw = ""; $("liveAnswer").innerHTML = "";
        const arg = typeof ev.input === "object" && ev.input ? (ev.input.query || ev.input.expression || JSON.stringify(ev.input)) : ev.input;
        const li = stepItem(ev.step);
        li.insertAdjacentHTML("beforeend", `<div data-tool>${esc(TOOL_VERB[ev.tool] || ev.tool)} <code>${esc(arg)}</code><span class="out">…</span></div>`);
        setStatus(`Step ${ev.step}: ${(TOOL_VERB[ev.tool] || ev.tool).toLowerCase()}`);
        break;
      }
      case "tool_result": {
        const pending = [...stepItem(ev.step).querySelectorAll("[data-tool] .out")].find((o) => o.textContent === "…");
        if (pending) { pending.textContent = ev.is_error ? ev.output_preview : summarizeResult(ev); pending.classList.toggle("bad", ev.is_error); }
        break;
      }
      case "done": final = ev.result || ev; break;
      case "error": error = ev.message; break;
    }
  };

  try {
    if (research) await streamPost("/agent/stream", { question, allow_web: $("allowWeb").checked }, onEvent);
    else await streamPost("/ask/stream", { question }, onEvent);
    if (error) throw new Error(error);
    if (!final) throw new Error("The connection closed before the answer finished. Please try again.");
    const d = final, secs = ((Date.now() - started) / 1000).toFixed(1);
    const limit = d.stopped_reason === "step_limit"
      ? notice("warn", "It ran out of steps, so this answer may be incomplete. Try a simpler or more specific question.") : "";
    const noSources = !d.citations || !d.citations.length
      ? `<p class="meta">No sources were cited. The answer may not be in your documents.</p>` : "";
    out.innerHTML = `${limit}<div class="answer">${renderAnswer(d.answer)}</div>${renderSources(d.citations)}${noSources}
      ${renderSteps(d.steps)}<p class="meta">${usageLine(d, secs)}</p>`;
  } catch (e) {
    out.innerHTML = notice("err", `Sorry, something went wrong: ${esc(e.message)}`);
  } finally {
    clearInterval(timer);
    $("askBtn").disabled = false;
  }
}

$("askBtn").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });

// Clicking a [n] marker highlights its source card.
$("result").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-src]");
  if (!a) return;
  e.preventDefault();
  const card = $(`src-${a.dataset.src}`);
  if (!card) return;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 1500);
});

$("examples").innerHTML = EXAMPLES.map((q) => `<button type="button">${esc(q)}</button>`).join("");
$("examples").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  $("question").value = e.target.textContent;
  if (/\$|calculat|cost|total/i.test(e.target.textContent)) document.querySelector('input[value="research"]').click();
  $("question").focus();
});

loadLibrary();
</script>
</body>
